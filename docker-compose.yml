version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: kisansathi-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: kisansathi
    volumes:
      - mongodb_data:/data/db
    networks:
      - kisansathi-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: kisansathi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kisansathi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisansathi-backend
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      MONGODB_URI: mongodb://admin:password@mongodb:27017/kisansathi?authSource=admin
      MONGODB_DATABASE: kisansathi
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_ENABLED: "True"
      SECRET_KEY: kisansathi_secret_key_2024
      JWT_SECRET_KEY: kisansathi_jwt_secret_2024
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kisansathi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisansathi-celery-worker
    command: celery -A celery_config worker --loglevel=info --concurrency=4
    environment:
      FLASK_ENV: production
      MONGODB_URI: mongodb://admin:password@mongodb:27017/kisansathi?authSource=admin
      MONGODB_DATABASE: kisansathi
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - mongodb
      - redis
      - backend
    networks:
      - kisansathi-network

  # Celery Beat
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisansathi-celery-beat
    command: celery -A celery_config beat --loglevel=info
    environment:
      FLASK_ENV: production
      MONGODB_URI: mongodb://admin:password@mongodb:27017/kisansathi?authSource=admin
      MONGODB_DATABASE: kisansathi
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - mongodb
      - redis
      - backend
    networks:
      - kisansathi-network

  # Frontend
  frontend:
    build:
      context: ./frontend/pixel-perfect-copy
      dockerfile: Dockerfile
    container_name: kisansathi-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://backend:5000
    depends_on:
      - backend
    networks:
      - kisansathi-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: kisansathi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - kisansathi-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_data:
  redis_data:

networks:
  kisansathi-network:
    driver: bridge
